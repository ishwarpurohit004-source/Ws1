<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Mod Details</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}
.card{
    width:100%;
    max-width:420px;
    background:#1e293b;
    border-radius:18px;
    overflow:hidden;
    color:#fff;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.banner{
    width:100%;
    height:200px;
    object-fit:cover;
}
.content{
    padding:20px;
}
.title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;
    text-align:center;
}
.details{
    display:flex;
    flex-direction:column;
    gap:10px;
}
.row{
    display:flex;
    justify-content:space-between;
    background:#334155;
    padding:12px;
    border-radius:10px;
}
.label{
    color:#94a3b8;
}
.value{
    font-weight:bold;
    color:#fff;
}
.download{
    display:block;
    text-align:center;
    margin-top:20px;
    background:#22c55e;
    color:#fff;
    text-decoration:none;
    padding:14px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}
.download:hover{
    background:#16a34a;
}
</style>
</head>

<body>

<div class="card">

<img src="game-banner.jpg" class="banner" alt="Game Banner">

<div class="content">

<div class="title">Ninja Arashi 2</div>

<div class="details">

<div class="row">
<span class="label">📦 Size</span>
<span class="value">145.62 MB</span>
</div>

<div class="row">
<span class="label">⚡ Version</span>
<span class="value">1.4.1</span>
</div>

<div class="row">
<span class="label">📱 Architecture</span>
<span class="value">ARMv7</span>
</div>

<div class="row">
<span class="label">🎮 Category</span>
<span class="value">Action</span>
</div>

<div class="row">
<span class="label">🛠 Mod Features</span>
<span class="value">Mod Menu</span>
</div>

<div class="row">
<span class="label">📅 Updated</span>
<span class="value">23 July 2026</span>
</div>

</div>

<a href="#" class="download">⬇ Download Now</a>

</div>

</div>

</body>
</html>
